# IP real del visitante. El panel está detrás de Cloudflare y del nginx de
# WingConcept: sin esto, TODOS los usuarios llegan con la IP interna de docker
# y los límites de abajo se comparten entre todos (basta que un grupo trabaje a
# la vez para dejar a los demás sin entrar). Cloudflare envía CF-Connecting-IP y
# el nginx de WingConcept lo reenvía tal cual.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

# 429 (demasiadas peticiones) en vez del 503 por defecto de nginx.
limit_req_status 429;
limit_conn_status 429;

limit_req_zone $binary_remote_addr zone=carrera_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=carrera_general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=carrera_conn:10m;
