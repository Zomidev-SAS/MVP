# Panel Carrera Arango — Producción (VPS, carrera.zomidev.com)
# docker compose -p carrera -f docker-compose.prod.yml --env-file .env up -d --build

name: carrera

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://carrera.zomidev.com}
    container_name: carrera_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://carrera.zomidev.com}
    networks:
      - carrera_internal

  nginx:
    image: nginx:alpine
    container_name: carrera_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/panel-standalone.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/panel-rate-limit.conf:/etc/nginx/conf.d/00-rate-limit.conf:ro
    ports:
      - "${CARRERA_NGINX_BIND:-172.17.0.1}:${CARRERA_NGINX_PORT:-8081}:8080"
    depends_on:
      - frontend
    networks:
      - carrera_internal

networks:
  carrera_internal:
    driver: bridge
